[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "cython>=3.1.3,<4",
    "numpy>=2.0,<3"
]
build-backend = "setuptools.build_meta"


[project]
name = "fABBA"
dynamic = ["version"]
description = "An efficient symbolic time series approximation with ABBA."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Xinye Chen", email = "xinye.chen@manchester.ac.uk"},
  {name = "Stefan Güttel", email = "stefan.guettel@manchester.ac.uk"}
]

dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.9",
    "requests",
    "pandas",
    "scikit-learn>=1.2",
    "joblib>=1.1.1",
    "matplotlib"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fABBA*"]

[tool.setuptools.package-data]
fABBA = ["jabba/data/*.npy", "jabba/data/*.arff"]

[tool.setuptools.dynamic]
version = {attr = "fABBA.__version__"}

[project.urls]
Homepage = "https://github.com/nla-group/fABBA"
Documentation = "https://fabba.readthedocs.io/"
Issues = "https://github.com/nla-group/fABBA/issues"

[project.optional-dependencies]
test = ["pytest>=7", "build>=1"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Publish regular CPython wheels only; new ABIs must be explicitly validated.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-win_arm64"
# Windows ARM64 is enabled by a platform-specific override below.
test-sources = ["tests", "example", "tools/check_wheel.py"]
test-command = "python tools/check_wheel.py"
environment = { FABBA_NO_EXTENSIONS = "0", PYTHONDONTWRITEBYTECODE = "1", PIP_ONLY_BINARY = ":all:" }
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["auto"]
environment = { FABBA_NO_EXTENSIONS = "0", PYTHONDONTWRITEBYTECODE = "1", PIP_ONLY_BINARY = ":all:", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["auto64"]
skip = "*-win32 cp39-win_arm64 cp310-win_arm64 cp311-win_arm64"
