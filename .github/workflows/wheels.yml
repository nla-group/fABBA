name: Release wheels

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'fABBA/**'
      - 'tests/**'
      - 'tools/**'
      - 'ci/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --sdist --outdir source-dist
      - run: python -m twine check --strict source-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: source-dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: source-dist
      - name: Build from the exact source distribution
        shell: python
        run: |
          import os
          from pathlib import Path
          source, = Path('source-dist').glob('*.tar.gz')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'FABBA_SDIST={source.resolve()}\n')
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ env.FABBA_SDIST }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  numpy1:
    # The same NumPy-2-built binaries must also execute with the older ABI.
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
        python: ['3.9', '3.12']
        include:
          - python: '3.9'
            constraints: ci/numpy1-py39.txt
          - python: '3.12'
            constraints: ci/numpy1-py312.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse
      - run: python -m pip install --upgrade pip
      - name: Test the actual release wheels with NumPy 1
        shell: bash
        run: |
          python -m pip install --only-binary=:all: -r ${{ matrix.constraints }} requests joblib
          python -m pip install --no-deps --no-index --find-links wheelhouse fABBA
          cp -R tests example tools "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python tools/check_wheel.py

  candidate:
    needs: [sdist, wheels, numpy1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-wheels-*
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: candidate
      - run: python -m pip install twine packaging
      - run: python -m unittest discover -s tools -p 'test_release.py' -v
      - run: python tools/check_release.py candidate
      - run: python -m twine check --strict candidate/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-release-candidate
          path: candidate/*
          if-no-files-found: error
      # Intentionally no upload to PyPI. Download this tested candidate and
      # publish the complete set only after reviewing this workflow's results.
